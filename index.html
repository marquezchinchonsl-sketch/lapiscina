<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiosco La Piscina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ── Cards Grid ─────────────────────── */
    .hero {
      background: #0d0d0d;
      padding: 72px 48px 0;
      position: relative;
      overflow: hidden;
    }

    .hero-inner {
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
      padding-bottom: 64px;
    }

    .hero-loc {
      font-size: 0.6rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-bottom: 16px;
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 10vw, 5.5rem);
      font-weight: 400;
      color: #faf9f7;
      line-height: 1.0;
      letter-spacing: -0.01em;
    }

    .hero-title em {
      font-style: italic;
      color: #5BA8A0;
      font-weight: 400;
    }

    .hero-wave {
      line-height: 0;
      margin-top: -2px;
    }

    .hero-wave svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .hero-info {
      margin-top: 28px;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.03em;
      line-height: 1.8;
      background: rgba(91,168,160,0.12);
      padding: 14px 24px;
      border-radius: 8px;
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0 6px;
      border: 1px solid rgba(91,168,160,0.25);
    }

    .hero-info span {
      color: #5BA8A0;
      font-weight: 500;
    }

    .cards {
      max-width: 700px;
      margin: 0 auto;
      padding: 64px 40px 80px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .card {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #fff;
      border: 1px solid rgba(26,24,22,0.08);
      border-radius: 14px;
      padding: 18px;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .card:hover {
      border-color: #5BA8A0;
      box-shadow: 0 6px 24px rgba(91,168,160,0.15);
      transform: translateY(-3px);
    }

    .card-text h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      color: #1a1816;
      text-align: center;
    }

    .card .arrow {
      font-size: 0.9rem;
      color: #5BA8A0;
      flex-shrink: 0;
    }

    .card--full {
      grid-column: 1 / -1;
      padding: 28px;
    }

    .card--full .card-text h2 {
      font-size: 1.2rem;
    }

    .card--promo {
      background: rgba(91,168,160,0.06);
      border-color: rgba(91,168,160,0.25);
    }

    .card--promo:hover {
      background: rgba(91,168,160,0.1);
    }

    .card--promo .card-text h2 {
      color: #4A8A82;
    }

    /* ── Responsive ─────────────────────── */
    @media (max-width: 540px) {
      .hero { padding: 56px 28px 0; }
      .hero-title { font-size: 3rem; }
      .hero-info {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        text-align: center;
        padding: 14px 20px;
      }
      .hero-info .hero-sep { display: none; }
      .cards { padding: 48px 24px 60px; }
    }
  </style>
</head>
<body>

  <!-- ── HERO ─────────────────────────── -->
  <section class="hero">
    <div class="hero-inner">
      <p class="hero-loc"></p>
      <h1 class="hero-title">Kiosco<br><em>La Piscina</em></h1>
      <p class="hero-info"><span class="hero-row">Celebramos cumpleaños</span><span class="hero-sep"> · </span><span class="hero-row">Llamanos al <span class="hero-phone">645 95 25 06</span></span><span class="hero-sep"> · </span><span class="hero-row">Aceptamos tarjeta</span></p>
    </div>
    <div class="hero-wave">
      <svg viewBox="0 0 1440 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 60 C360 120 720 0 1080 60 C1260 90 1380 80 1440 60 L1440 120 L0 120 Z" fill="#0d0d0d"/>
      </svg>
    </div>
  </section>

  <!-- ── CARDS ───────────────────────────── -->
  <div class="cards">
    <a href="hamburguesas.html" class="card">
      <div class="card-text"><h2>Hamburguesas</h2></div>
      <div class="arrow">→</div>
    </a>

    <a href="perritos.html" class="card">
      <div class="card-text"><h2>Perritos</h2></div>
      <div class="arrow">→</div>
    </a>

    <a href="sandwiches.html" class="card">
      <div class="card-text"><h2>Sándwiches</h2></div>
      <div class="arrow">→</div>
    </a>

    <a href="pizzelas.html" class="card">
      <div class="card-text"><h2>Pizzelas</h2></div>
      <div class="arrow">→</div>
    </a>

    <a href="bocadillos.html" class="card">
      <div class="card-text"><h2>Bocadillos</h2></div>
      <div class="arrow">→</div>
    </a>

    <a href="montados.html" class="card">
      <div class="card-text"><h2>Montados</h2></div>
      <div class="arrow">→</div>
    </a>

    <a href="pinchos.html" class="card">
      <div class="card-text"><h2>Pinchos</h2></div>
      <div class="arrow">→</div>
    </a>

    <a href="raciones.html" class="card">
      <div class="card-text"><h2>Raciones</h2></div>
      <div class="arrow">→</div>
    </a>

    <a href="ensaladas.html" class="card">
      <div class="card-text"><h2>Ensaladas</h2></div>
      <div class="arrow">→</div>
    </a>

    <a href="combinados.html" class="card">
      <div class="card-text"><h2>Combinados</h2></div>
      <div class="arrow">→</div>
    </a>

    <a href="bebidas.html" class="card card--full">
      <div class="card-text"><h2>Bebidas</h2></div>
      <div class="arrow">→</div>
    </a>

  </div>

</body>
</html>
